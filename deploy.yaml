apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pyapp
  name: pyapp
  namespace: pyapp-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pyapp
  template:
    metadata:
      labels:
        app: pyapp
    spec:
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: nfs-shared-claim        
      containers:
        - image: equiano112/pythonapp:v0.0.4
          name: pyapp
          volumeMounts:
          - name: shared
            mountPath: /app/logs
          ports:
          - containerPort: 5000
          resources:
            requests:
              memory: "10Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "500m"

---

apiVersion: v1
kind: Service
metadata:
  name: pyapp-svc
  namespace: pyapp-ns
spec:
  type: NodePort
  selector:
    app: pyapp
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30080
